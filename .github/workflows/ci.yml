name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # SDK 10 builds everything; runtimes 8 and 9 are needed to run the multi-targeted tests.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "trx" --results-directory TestResults

      - name: Pack
        run: dotnet pack --configuration Release --no-build --output artifacts

      # Restores the packed SDK into a fresh net10.0 consumer with TreatWarningsAsErrors, so a
      # dependency floor below what a transitive package requires (NU1605 downgrade) fails here
      # instead of in consumers' builds. net10.0 is where Microsoft.Extensions.Http.Resilience
      # raises the Microsoft.Extensions.* floor.
      - name: Consumer restore check (net10.0)
        run: |
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer"
          cat > "$consumer/nuget.config" <<EOF
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$GITHUB_WORKSPACE/artifacts" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <!-- Resolve the SDK only from the freshly packed artifacts, never the published package. -->
            <packageSourceMapping>
              <packageSource key="local">
                <package pattern="Carandev.WhatsApp.Sdk" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF
          cat > "$consumer/Consumer.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Carandev.WhatsApp.Sdk" Version="*-*" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore "$consumer/Consumer.csproj"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*
